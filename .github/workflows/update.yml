name: Update Zwolle Natuurdata

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python instellen
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Script draaien
        run: python fetch_zwolle.py

      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animals.json
          git commit -m "Automatische update dieren Zwolle" || exit 0
          git push
